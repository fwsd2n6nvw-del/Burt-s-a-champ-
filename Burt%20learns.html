<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Burt Learns</title><style>*{box-sizing:border-box}body{background:#0b1220;color:#e5edf5;font:14px system-ui;margin:0;padding:16px}main{max-width:520px;margin:auto}h1{font-size:32px;letter-spacing:-1px;margin:0}small{color:#9aadc0}.world{display:flex;gap:12px;margin:16px 0;align-items:stretch}canvas{display:block;min-width:0;width:calc(100% - 48px);height:auto;align-self:flex-start;aspect-ratio:1;background:#101b2b;border-radius:6px;transition:opacity .65s}.health{width:36px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px}.tube{width:19px;flex:1;background:#253244;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}.fill{width:100%;background:#57ad85;transition:height .2s}.rest{height:7px;background:#253244;border-radius:5px;overflow:hidden}.rest div{height:100%;background:#668cc8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stats b{display:block;font-size:21px}button{background:#1b293b;color:#e5edf5;border:1px solid #36465b;border-radius:7px;padding:10px 12px;font:600 12px system-ui;cursor:pointer}button:first-child{background:#347b60}nav{display:flex;flex-wrap:wrap;gap:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}label{display:block;margin:12px 0;color:#aab9ca}.activity{display:flex;gap:8px;align-items:center;background:#142235;border:1px solid #304257;border-radius:7px;padding:8px 10px;margin:10px 0;min-height:38px}.activity b{color:#e5edf5}.activity small{margin-left:auto;text-align:right;color:#8fc9ad}</style></head><body><main><h1>Burt Learns</h1><small>Autonomous survival experiment · 0.6</small><div class=world><canvas id=c width=640 height=640></canvas><div class=health>HEALTH<div class=tube><div class=fill id=hp></div></div><span id=hv></span></div></div><small id=rv></small><div class=rest><div id=rest></div></div><div class=stats><div><sm 'use strict';const $=id=>document.getElementById(id),N=40,A=7,G=7,D=5,lr=.003,key='burt-learns-v1',rnd=()=>Math.random()-.5,dirs=[[0,-1],[1,0],[0,1],[-1,0]],names=['north','east','south','west','wait','sleep','slow move'];let training=false,trainStart=0,trainTarget=0,resumeLive=false;let eventUntil=0,eventText="",lastAssociation="",running=false,transition=false,last=performance.now(),acc=0,prev=null,timer=null;const zeros=n=>Array(n).fill(0),matrix=(n,m)=>Array.from({length:n},()=>Array.from({length:m},()=>rnd()*.2));function brain(){return {q:matrix(G,D),k:matrix(G,D),w:matrix(A,G*D),b:zeros(A),updates:0,decisions:0,lives:0,best:0,history:[],mana:0,reward:0}}function validBrain(b){const mat=(v,n,m)=>Array.isArray(v)&&v.length===n&&v.every(r=>Array.isArray(r)&&r.length===m&&r.every(Number.isFinite));return b&&mat(b.q,G,D)&&mat(b.k,G,D)&&mat(b.w,A,G*D)&&Array.isArray(b.b)&&b.b.length===A&&b.b.every(Number.isFinite)&&['updates','decisions','lives','best','mana','reward'].every(k=>Number.isFinite(b[k]))&&Array.isArray(b.history)&&b.history.every(Number.isFinite)}function validState(s){return s&&['x','y','h','r','t','world','age','spawn','cool','action','heading'].every(k=>Number.isFinite(s[k]))&&Number.isInteger(s.x)&&Number.isInteger(s.y)&&s.x>=0&&s.x<N&&s.y>=0&&s.y<N&&s.h>=0&&s.h<=100&&s.r>=0&&s.r<=100&&Number.isInteger(s.action)&&s.action>=0&&s.action<A&&Number.isInteger(s.heading)&&s.heading>=0&&s.heading<4&&['blocks','mana'].every(k=>Array.isArray(s[k])&&s[k].every(v=>Number.isInteger(v)&&v>=0&&v<N*N))&&!s.blocks.includes(s.y*N+s.x)&&s.seen&&typeof s.seen==='object'&&Array.isArray(s.trail)}let B=brain(),S;try{let p=JSON.parse(localStorage.getItem(key));if(p && validBrain(p.B)){B=p.B;if(validState(p.S))S=p.S}}catch{}function save(force=false){if(training&&!force)return;try{localStorage.setItem(key,JSON.stringify({B,S}))}catch{ $('status').textContent='Local storage unavailable'; }}function valid(x,y){return x>=0&&y>=0&&x<N&&y<N&&!S.blocks.includes(y*N+x)}function let reached=new Set([820]),queue=[820];for(let i=0;i<queue.length;i++){let p=queue[i];for(let [dx,dy] of dirs){let x=p%N+dx,y=Math.floor(p/N)+dy,n=y*N+x;if(valid(x,y)&&!reached.has(n)){reached.add(n);queue.push(n)}}}for(let p=0;p<N*N;p++)if(!reached.has(p)&&!S.blocks.includes(p))S.blocks.push(p);spawn(true);prev=null;save()}function spawn(initial=false){let count=Math.min(10-S.mana.length,initial?6:4+Math.floor(Math.random()*3));for(let i=0;i<count;i++){let p;for(let j=0;j<200;j++){p=Math.floor(Math.random()*1600);if(valid(p%N,Math.floor(p/N))&&!S.mana.includes(p)&&p!==S.y*N+S.x){S.mana.push(p);break}}}S.spawn=30+Math.random()*60}if(!S)world();else if(S.mana.length>10){S.mana=S.mana.slice(0,10);save()}function visible(x,y){let dx=x-S.x,dy=y-S.y;if(dx*dx+dy*dy>64)return false;let n=Math.max(Math.abs(dx),Math.abs(dy));for(let i=1;i<n;i++)if(!valid(Math.round(S.x+dx*i/n),Math.round(S.y+dy*i/n)))return false;return true}function observe(){for(let y=Math.max(0,S.y-8);y<=Math.min(39,S.y+8);y++)for(let x=Math.max(0,S.x-8);x<=Math.min(39,S.x+8);x++)if(visible(x,y))S.seen[y*N+x]=S.mana.includes(y*N+x)?2:1;let m=Object.keys(S.seen).filter(p=>S.seen[p]===2).map(Number).sort((a,b)=>Math.hypot(a%N-S.x,Math.floor(a/N)-S.y)-Math.hypot(b%N-S.x,Math.floor(b/N)-S.y))[0];let dx=m===undefined?0:(m%N-S.x)/40,dy=m===undefined?0:(Math.floor(m/N)-S.y)/40;let free=dirs.map(([x,y])=>valid(S.x+x,S.y+y)?1:0),nov=dirs.map(([x,y])=>S.seen[(S.y+y)*N+S.x+x]?0:1);return [[S.h/100,1-S.h/100,0,0,1],[S.r/100,1-S.r/100,0,0,1],[dx,dy,m===undefined?0:1,Math.hypot(dx,dy),1],[...free,1],[...nov,1],[S.x/39,S.y/39,Object.keys(S.seen).length/1600,S.age/240,1],[S.heading/3,S.action/6,S.cool,0,1]]}const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);function forward(X){let att=[],z=[];for(let i=0;i<G;i++){let scores=X.map((x,j)=>dot(B.q[i],X[i])*dot(B.k[j],x));let e=scores.map(s=>Math.exp(Math.max(-20,Math.min(20,s))));let sum=e.reduce((a,b)=>a+b);let a=e.map(v=>v/sum);att.push(a);for(let d=0;d<D;d++)z.push(a.reduce( const ctx=$('c').getContext('2d'),C=16;let px=S.x,py=S.y;function draw(){px+=(S.x-px)*.22;py+=(S.y-py)*.22;ctx.fillStyle='#101b2b';ctx.fillRect(0,0,640,640);ctx.strokeStyle='#243449';ctx.lineWidth=.6;ctx.beginPath();for(let i=0;i<=40;i++){ctx.moveTo(i*C,0);ctx.lineTo(i*C,640);ctx.moveTo(0,i*C);ctx.lineTo(640,i*C)}ctx.stroke();ctx.fillStyle='#304d65';for(let p of S.blocks)ctx.fillRect(p%N*C,Math.floor(p/N)*C,C,C);ctx.fillStyle='#6de6a3';for(let p of S.mana)ctx.fillRect(p%N*C+4,Math.floor(p/N)*C+4,8,8);ctx.strokeStyle='#a7c9ed55';ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc((px+.5)*C,(py+.5)*C,8*C,0,Math.PI*2);ctx.fillStyle='#a7c9ed09';ctx.fill();ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f4f3df';ctx.beginPath();ctx.arc((px+.5)*C,(py+.5)*C,6,0,7);ctx.fill();ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText(S.action===5?'Burt · Z':'Burt',(px+.5)*C,(py+.5)*C-12);$('hp').style.height=S.h+'%';$('hp').style.background=S.h>50?'#57ad85':S.h>25?'#c3a054':'#be6555';$('hv').textContent=Math.round(S.h)+'%';$('rv').textContent='Rest · '+Math.round(S.r)+'%';$('rest').style.width=S.r+'%';$('life').textContent=B.lives+1;$('surv').textContent=Math.floor(S.t/60)+':'+String(Math.floor(S.t%60)).padStart(2,'0');$('dec').textContent=B.decisions;$('status').textContent='World '+S.world+' · '+names[S.action]+' · next world '+Math.ceil(240-S.age)+'s';$('activity').textContent=transition?'Changing world':S.h<=0?'Dead':!running?'Paused':performance.now()<eventUntil?eventText:S.action===5?'Sleeping':S.action===4?'Resting':'Moving · '+(S.action===6?'slow':names[S.action]);$('learning').textContent=running&&!transition?'Learning'+(lastAssociation?' · '+lastAssociation:''):B.updates?'Learning paused · '+B.updates+' updates':'Awaiting experience';$('go').textContent=running?'Pause':'Go'}function loop(t){let dt=Math.min(100,t-last);last=t;if(training){requestAnimationFrame(loop);return}if(running&&!transition){acc+=dt;if(acc>=500){acc-=500;tick()}}draw();requestAnimationFrame(loo
